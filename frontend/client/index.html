<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

  <!-- Default SEO - Will be overridden by useSEO hook on each page -->
  <title>Your Insurance, Decoded | Indsure</title>
  <meta name="description"
    content="Upload your insurance policy PDF. See your coverage limits, co-pay logic, gaps, and next steps in 60 seconds. Free & private." />
  <meta name="keywords"
    content="health insurance, insurance analyzer, policy checker, insurance calculator, compare insurance, room limit, co-pay, insurance explained" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://indsure.in/" />
  <meta property="og:title" content="Your Insurance, Decoded | Indsure" />
  <meta property="og:description"
    content="Upload your insurance policy PDF. See your coverage limits, co-pay logic, gaps, and next steps in 60 seconds. Free & private." />
  <meta property="og:image" content="https://beta.indsure.in/opengraph.jpg" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://indsure.in/" />
  <meta name="twitter:title" content="Your Insurance, Decoded | Indsure" />
  <meta name="twitter:description"
    content="Upload your insurance policy PDF. See your coverage limits, co-pay logic, gaps, and next steps in 60 seconds. Free & private." />
  <meta name="twitter:image" content="https://beta.indsure.in/opengraph.jpg" />

  <!-- Canonical -->
  <link rel="canonical" href="https://indsure.in/" />

  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- Fonts are self-hosted (Inter + Playfair Display via @fontsource, imported
       in main.tsx). No external font requests, so no Google Fonts consent
       banner is needed. -->

  <!-- Performance hints -->
  <meta http-equiv="x-dns-prefetch-control" content="on" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
