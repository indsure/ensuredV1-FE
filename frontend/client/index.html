    content="insurance policy checker India, health insurance analyzer, room rent cap, co-pay, waiting period, mediclaim explained, term insurance, car insurance IDV, compare insurance policy" />

  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- Fonts are self-hosted (Inter + Playfair Display via @fontsource, imported
       in main.tsx). No external font requests, so no Google Fonts consent
       banner is needed. -->

  <!-- Performance hints -->
  <meta http-equiv="x-dns-prefetch-control" content="on" />

  <!-- Site-wide structured data, one graph. Every prerendered page inherits it
       from this template, so no page component may inject a second copy of
       these types. The old SearchAction was dropped: Google retired the
       sitelinks search box in November 2024. No WebApplication either: Google
       treats it as a software-app rich result and flags it invalid without
       ratings or reviews, on every page that carries it. -->
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://indsure.in/#org",
      "name": "IndSure",
      "alternateName": "IndSure India",
      "url": "https://indsure.in/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://indsure.in/logo-512.png",
        "width": 512,
        "height": 512
      },
      "description": "IndSure keeps your family's health, term life and motor insurance policies in one private dashboard and explains what each covers and won't pay, in plain language. No commissions, no sales calls.",

      "email": "support@indsure.in",
      "sameAs": [
        "https://www.instagram.com/indsure.in/",
        "https://x.com/IndSure_Ind",
        "https://www.linkedin.com/company/indsure"
      ]
    },
    {
      "@type": "WebSite",
      "@id": "https://indsure.in/#website",
      "name": "IndSure",

        "IndSure India",
        "indsure.in"

}
