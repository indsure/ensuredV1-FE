<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

  <!-- Default SEO - Will be overridden by useSEO hook on each page -->
  <title>Decode Your Insurance Policy Free in 60 Seconds | IndSure India</title>
  <meta name="description"
    content="Upload your health, term life, or car insurance PDF. IndSure shows your room-rent cap, co-pay, waiting periods, and coverage gaps in plain language in about 60 seconds. Free, private, no sales calls." />
  <meta name="keywords"
    content="insurance policy checker India, health insurance analyzer, room rent cap, co-pay, waiting period, mediclaim explained, term insurance, car insurance IDV, compare insurance policy" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://indsure.in/" />
  <meta property="og:title" content="Decode Your Insurance Policy Free in 60 Seconds | IndSure India" />
  <meta property="og:description"
    content="Upload your health, term life, or car insurance PDF. IndSure shows your room-rent cap, co-pay, waiting periods, and coverage gaps in plain language. Free, private, no sales calls." />
  <meta property="og:image" content="https://indsure.in/opengraph.jpg" />
  <meta property="og:site_name" content="IndSure" />
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@IndSure_Ind" />
  <meta name="twitter:url" content="https://indsure.in/" />
  <meta name="twitter:title" content="Decode Your Insurance Policy Free in 60 Seconds | IndSure India" />
  <meta name="twitter:description"
    content="Upload your health, term life, or car insurance PDF. IndSure shows your room-rent cap, co-pay, waiting periods, and coverage gaps in plain language. Free, private, no sales calls." />
  <meta name="twitter:image" content="https://indsure.in/opengraph.jpg" />

  <!-- Canonical -->
  <link rel="canonical" href="https://indsure.in/" />

  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- Fonts are self-hosted (Inter + Playfair Display via @fontsource, imported
       in main.tsx). No external font requests, so no Google Fonts consent
       banner is needed. -->

  <!-- Performance hints -->
  <meta http-equiv="x-dns-prefetch-control" content="on" />

  <!-- Static structured data (visible to non-JS crawlers incl. AI answer engines) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "IndSure",
    "alternateName": "IndSure Insurance Policy Analyzer",
    "url": "https://indsure.in",
    "logo": "https://indsure.in/favicon.png",
    "description": "IndSure reads your Indian health, term life, and motor insurance policy PDF and explains your coverage limits, room-rent cap, co-pay, waiting periods, and gaps in plain language. Free and private.",
    "areaServed": "IN",
    "sameAs": [
      "https://www.instagram.com/indsure.in/",
      "https://x.com/IndSure_Ind"
    ],
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "Customer Service",
      "email": "support@indsure.in"
    }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "IndSure",
    "url": "https://indsure.in",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://indsure.in/blog?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
